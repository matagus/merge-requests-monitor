name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: pip install hatch

      - name: Run tests with Hatch
        run: hatch run test.py${{ matrix.python-version }}:test

      - name: Generate coverage report
        run: hatch run test.py${{ matrix.python-version }}:cov

  # Packaging regression check. The tests never touch setup.py/py2app, so until now a
  # broken bundle only surfaced when a version tag was pushed. Mirrors the release
  # workflow's interpreter (pinned to the same patch) and runs the same build/verify
  # steps via the composite action, so a change to either cannot drift silently.
  # Deliberately not part of the version matrix: the failure mode here is the runner's
  # python.org framework build, not the project's minimum supported version.
  package:
    name: Build & sign app bundle
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          cache: "pip"

      - name: Build, sign and smoke test the bundle
        uses: ./.github/actions/build-app

  pre-commit:
    name: Pre-commit Hooks
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
