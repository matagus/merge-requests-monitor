name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: pip install hatch

      - name: Run tests with Hatch
        run: hatch run test.py${{ matrix.python-version }}:test

      - name: Generate coverage report
        run: hatch run test.py${{ matrix.python-version }}:cov

  # Dependency manifests must not drift apart. pyproject.toml is the single source of
  # truth; uv.lock is generated from it by `uv lock`, and requirements.txt is generated
  # from uv.lock by `uv export` (its header records the exact command). Asserting both
  # derivations here means a pin edited in the wrong file fails the build, instead of a
  # release silently bundling dependencies that differ from the manifest -- requirements.txt
  # is what the package job below installs, and what the release workflow builds with.
  deps:
    name: Dependencies in sync
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Assert uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Assert requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-emit-project --no-hashes --no-annotate -o "${RUNNER_TEMP}/requirements.txt"
          # -I ignores the two-line "autogenerated by uv" header, which records the command
          # and so differs in the output path; everything below it must match byte for byte.
          if ! diff -u -I '^#' requirements.txt "${RUNNER_TEMP}/requirements.txt"; then
            echo "::error::requirements.txt is stale - regenerate it with 'hatch run deps:sync'"
            exit 1
          fi

  # Packaging regression check. The tests never touch setup.py/py2app, so until now a
  # broken bundle only surfaced when a version tag was pushed. Mirrors the release
  # workflow's interpreter (pinned to the same patch) and runs the same build/verify
  # steps via the composite action, so a change to either cannot drift silently.
  # Deliberately not part of the version matrix: the failure mode here is the runner's
  # python.org framework build, not the project's minimum supported version.
  package:
    name: Build & sign app bundle
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          cache: "pip"

      - name: Build, sign and smoke test the bundle
        uses: ./.github/actions/build-app

  pre-commit:
    name: Pre-commit Hooks
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
