[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MergeRequestsMonitor"
dynamic = ["version"]
description = "A System Tray app for Mac OSX that monitors your open merge requests and let you access them quickly. So far it only supports Gitlab's pull requests."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Agustin Mendez", email = "matagus@gmail.com" },
]
keywords = ["gitlab", "merge requests", "system tray", "mac osx", "python", "py2app"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
# Single source of truth for the app's dependencies. uv.lock is derived from this list
# by `uv lock` and requirements.txt from uv.lock by `uv export`; edit them only through
# `hatch run deps:sync` (see [tool.hatch.envs.deps]), never by hand.
dependencies = [
  "feedparser==6.0.14",
  "py2app==0.28.10",
  "rumps==0.4.0",
]

[project.urls]
Homepage = "https://github.com/matagus/merge-requests-monitor"
Issues = "https://github.com/matagus/merge-requests-monitor/issues"
Changelog = "https://github.com/matagus/merge-requests-monitor/releases"
Repository = "https://github.com/matagus/merge-requests-monitor"

[tool.hatch.version]
path = "__about__.py"

# Hatch creates its environments inside the project root (`merge-requests-monitor/` for
# the default env, `merge-requests-monitor-test-py3.14/` for a matrix one) and hides each
# of them by writing a `.gitignore` containing `*` *inside* the directory. Git honours
# that, the hatchling file walker does not: it consults the repository's own ignore files
# only, so an sdist built from a developer checkout swallowed the whole virtualenv --
# 1080 of the 1118 entries in one such tarball -- and then aborted on the venv's absolute
# `bin/python` symlink:
#
#   tarfile.AbsoluteLinkError: 'mergerequestsmonitor-0.6.0/merge-requests-monitor/bin/python'
#   is a link to an absolute path
#
# The root .gitignore already keeps build/, dist/, .eggs/, htmlcov/ and __pycache__/ out
# of the sdist because hatchling does read that file; these environment directories are
# the part it cannot see, so they are excluded here rather than left to ignore files.
[tool.hatch.build.targets.sdist]
exclude = [
    "/merge-requests-monitor*",
    "/.venv*",
]

[tool.hatch.envs.default]
dependencies = [
    "ipython", "ipdb"
]

[tool.hatch.envs.default.scripts]
app = "python main.py"

# Regenerates the two derived dependency files from this manifest: `uv lock` refreshes
# uv.lock from [project] dependencies, `uv export` rewrites requirements.txt from that
# lockfile. Neither is hand-edited -- the CI `deps` job fails if either drifts -- so run
# `hatch run deps:sync` whenever [project] dependencies change. `--no-hashes` because
# rumps ships no wheel: emitting hashes would put pip into --require-hashes mode, which
# then also demands hashes for that sdist's build-system requirements.
[tool.hatch.envs.deps]
dependencies = ["uv"]

[tool.hatch.envs.deps.scripts]
sync = "uv lock && uv export --frozen --no-emit-project --no-hashes --no-annotate -o requirements.txt"

[tool.hatch.envs.test]
dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
cov = "pytest --cov=. --cov-report=term-missing --cov-report=html {args:tests}"
app = "python main.py"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120

# The deliverable is the macOS .app bundle built by py2app (setup.py); the code
# itself lives in the root-level main.py/__about__.py modules, there is no
# importable package directory. `packages = ["mergerequestsmonitor"]` pointed at
# a directory that does not exist, and hatchling does not reject that: it built a
# wheel whose only entries were the dist-info metadata and licenses, so an
# installed wheel provided nothing at all. Naming the real top-level modules is
# what makes the wheel ship the code it claims to.
[tool.hatch.build.targets.wheel]
only-include = ["main.py", "__about__.py"]
